[project]
name = "pinceau-mcp"
version = "0.1.0"
description = "Serveur MCP pour piloter GIMP 3.2 : calques, sélections, peinture, filtres, photomontage"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2"]

[project.scripts]
pinceau-mcp = "pinceau_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["server"]

[tool.setuptools.package-dir]
"" = "server"
